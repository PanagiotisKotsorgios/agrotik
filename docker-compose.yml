# AGROTIK — self-contained production stack
#
# Deploys EVERYTHING on the same host:
#   - Postgres (Supabase-flavoured, με realtime + auth schemas)
#   - Postgres meta (pg-meta)
#   - PostgREST (auto-REST από τα tables)
#   - GoTrue (Supabase Auth)
#   - Realtime (websocket subscriptions)
#   - Kong (API gateway, ενοποιεί όλα σε ένα endpoint)
#   - Web (Next.js — AGROTIK app)
#
# All config files (kong.yml, roles.sql, jwt.sql, realtime.sql) are inlined
# via the top-level `configs:` block, so there are NO bind mounts — this
# avoids the Coolify quirk where a relative-path bind source ends up being
# created as an empty directory inside the container.
#
# Coolify deploy:
#   New Resource → Docker Compose from GitHub
#     Repo:   https://github.com/PanagiotisKotsorgios/agrotik
#     Branch: main
#     File:   docker-compose.yml
#   Domain (Coolify UI): web → your domain
#   Env vars (see .env.example — defaults work out of the box, override για prod).
#
# ⚠️  IMPORTANT after a failed deploy that created a Postgres volume without
# the correct role passwords: DELETE the `agrotik-db` persistent volume in
# Coolify (Persistent Storage tab) before redeploying, or the reserved
# Supabase roles (authenticator, supabase_auth_admin, …) will stay unset and
# auth/rest/realtime will never start.

services:
  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    volumes:
      # Renamed from `agrotik-db` → `agrotik-db-v4` on 2026-08-31 to force
      # Coolify to create a fresh Postgres data volume. The prior volume
      # held reserved Supabase roles with NULL passwords (created before
      # the init scripts were in place) and cannot be repaired from the
      # app. The old volume becomes orphaned and can be removed later via
      # the Coolify server terminal: `docker volume rm <prefix>_agrotik-db`.
      - agrotik-db-v4:/var/lib/postgresql/data
    configs:
      # Supabase's Postgres image runs everything in
      # /docker-entrypoint-initdb.d/{init-scripts,migrations}/ ONLY when
      # PGDATA is empty. On a fresh volume these set role passwords and
      # create the _realtime schema. On an existing volume they are ignored
      # — that is why a broken older volume must be deleted, not repaired.
      - source: supabase-roles-sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-roles.sql
        mode: 0444
      - source: supabase-jwt-sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        mode: 0444
      - source: supabase-realtime-sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        mode: 0444
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: ${JWT_EXP:-3600}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  meta:
    image: supabase/postgres-meta:v0.83.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXP:-3600}

  auth:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_ORIGIN:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: "/auth/callback"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/callback"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/callback"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/callback"
    # No healthcheck: the gotrue image is a minimal scratch-ish container
    # without wget/curl/nc, so any HTTP probe returns exit 127 immediately
    # and compose marks the container unhealthy before start_period even
    # applies. Kong tolerates upstream not-yet-ready (returns 502 until
    # gotrue answers), so `depends_on: service_started` is enough.

  realtime:
    image: supabase/realtime:v2.30.34
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      # Connect as supabase_admin (owner of _realtime). Its default
      # search_path is set to `_realtime, public` in realtime.sql init,
      # so Ecto's migrator connection sees the right schema too —
      # DB_AFTER_CONNECT_QUERY is not enough because the migrator pool
      # skips it.
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: "-proto_dist inet_tcp"
      FLY_APP_NAME: realtime
      FLY_ALLOC_ID: fly123
      RLIMIT_NOFILE: "10000"
      DNS_NODES: "''"

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      realtime:
        condition: service_started
      meta:
        condition: service_started
    expose:
      - "8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: "160k"
      KONG_NGINX_PROXY_PROXY_BUFFERS: "64 160k"
    configs:
      - source: kong-yaml
        target: /var/lib/kong/kong.yml
        mode: 0444

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${APP_ORIGIN:-http://localhost:3000}/api}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
    image: agrotik-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${APP_ORIGIN:-http://localhost:3000}/api}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_INTERNAL_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      # Web runs its migrations as `postgres`, which the Supabase Postgres
      # image always creates with POSTGRES_PASSWORD — safe on any volume.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: ${JWT_EXP:-3600}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@agrotik.gr}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Do NOT publish to the host — Coolify routes via Traefik on its internal
    # `coolify` network. Publishing collides with whatever else uses :3000
    # (often Coolify itself). Just expose so Traefik can reach it.
    expose:
      - "3000"
    healthcheck:
      # Probe /api/health (a plain JSON route). The middleware skips /api/*
      # and Next serves the file route before applying the /api → kong
      # rewrite, so this bypasses both middleware and Supabase entirely.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

configs:
  supabase-roles-sql:
    content: |
      -- Runs only on a fresh PGDATA directory.
      \set pgpass `echo "$POSTGRES_PASSWORD"`

      -- 1. Sync every reserved Supabase role's password to POSTGRES_PASSWORD.
      alter user supabase_admin with password :'pgpass';
      alter user authenticator with password :'pgpass';
      alter user pgbouncer with password :'pgpass';
      alter user supabase_auth_admin with password :'pgpass';
      alter user supabase_functions_admin with password :'pgpass';
      alter user supabase_storage_admin with password :'pgpass';

      -- 2. Hand the `auth` schema and its pre-installed helper functions
      --    over to supabase_auth_admin. The supabase/postgres image ships
      --    with auth.uid() / auth.role() / auth.email() / auth.jwt() owned
      --    by `postgres`; gotrue's migrations later try to `create or
      --    replace function` them as supabase_auth_admin and fail with
      --    "must be owner of function uid" unless ownership is transferred.
      alter schema auth owner to supabase_auth_admin;
      alter function auth.uid() owner to supabase_auth_admin;
      alter function auth.role() owner to supabase_auth_admin;
      alter function auth.email() owner to supabase_auth_admin;
      alter function auth.jwt() owner to supabase_auth_admin;

  supabase-jwt-sql:
    content: |
      -- Publish JWT settings so PostgREST can validate tokens.
      \set jwt_secret `echo "$JWT_SECRET"`
      \set jwt_exp `echo "$JWT_EXP"`
      alter database postgres set "app.settings.jwt_secret" to :'jwt_secret';
      alter database postgres set "app.settings.jwt_exp" to :'jwt_exp';

  supabase-realtime-sql:
    content: |
      -- Realtime's Ecto migrations run in the `_realtime` schema; create it
      -- ahead of time and hand it to supabase_admin (whom Realtime connects as).
      create schema if not exists _realtime;
      alter schema _realtime owner to supabase_admin;
      -- Make _realtime the default search_path for supabase_admin.
      -- DB_AFTER_CONNECT_QUERY is not enough because the Ecto migrator
      -- uses a separate pool that skips it; the role default IS applied.
      alter role supabase_admin set search_path to _realtime, public;

  kong-yaml:
    content: |
      _format_version: "1.1"

      consumers:
        - username: anon
          keyauth_credentials:
            - key: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
          acls:
            - group: anon
        - username: service_role
          keyauth_credentials:
            - key: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
          acls:
            - group: admin

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      services:
        - name: auth-v1-open
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths: [/auth/v1/verify]
          plugins:
            - name: cors

        - name: auth-v1-open-callback
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths: [/auth/v1/callback]
          plugins:
            - name: cors

        - name: auth-v1-open-authorize
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths: [/auth/v1/authorize]
          plugins:
            - name: cors

        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths: [/auth/v1/]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin, anon]

        - name: rest-v1
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths: [/rest/v1/]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin, anon]

        - name: realtime-v1-ws
          url: http://realtime:4000/socket
          protocol: http
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths: [/realtime/v1/]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin, anon]

        - name: meta
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths: [/pg/]
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin]

volumes:
  agrotik-db-v4:
